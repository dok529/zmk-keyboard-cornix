# Enables ZMK Studio for the direct-BLE split build (cornix_left / cornix_right
# / cornix_ph_left). Only cornix_left is the split-central role, so it's the
# one that actually gets the RPC stack (see app/src/studio/Kconfig: RPC is
# only selected when !ZMK_SPLIT or ZMK_SPLIT_ROLE_CENTRAL); connect Studio to
# whichever half is currently paired to the host. No extra snippet is needed
# for the transport: CONFIG_ZMK_STUDIO_TRANSPORT_BLE defaults to y whenever
# CONFIG_ZMK_BLE is enabled, which it already is for this board.
CONFIG_ZMK_STUDIO=y

# Match the settings already used for the dongle build's Studio support
# (boards/shields/cornix_dongle_adapter/cornix_dongle_adapter.conf).
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
